[package]
name = "palworld-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Unified CLI for Palworld Dedicated Server administration via REST API and RCON."
license = "MIT OR Apache-2.0"
repository = "https://github.com/realalden27/palworld-cli"
homepage = "https://github.com/realalden27/palworld-cli"
readme = "README.md"
keywords = ["palworld", "cli", "rcon", "rest-api", "game-server"]
categories = ["command-line-utilities", "game-development"]
include = [
    "/src/**",
    "/tests/**",
    "/LICENSE-*",
    "/README.md",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[lib]
name = "palworld_cli"
path = "src/lib.rs"

[[bin]]
name = "palworld-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
comfy-table = "8.0"
crossterm = "0.29"

palworld-api = "0.1.0"
rconet = "0.1.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_imports = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_variables = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
cognitive_complexity = "deny"
